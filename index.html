<!DOCTYPE html>
<html>
<head>
<title>Report Supply System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    gap:15px;
    padding:20px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
}

.logo{
    height:50px;
}

.title{
    font-size:22px;
    font-weight:bold;
}

/* CONTAINER */

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

/* SEARCH BOX */

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

input{
    flex:1;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    padding:14px 25px;
    border:none;
    border-radius:10px;
    background:#00c6ff;
    background: linear-gradient(to right,#00c6ff,#0072ff);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}

/* TABLE */

.table-container{
    overflow-x:auto;
    background: rgba(255,255,255,0.05);
    padding:15px;
    border-radius:15px;
}

table{
    width:100%;
    border-collapse: collapse;
}

th{
    background:#00c6ff;
    color:white;
    padding:12px;
    text-align:left;
}

td{
    padding:12px;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

tr:hover{
    background: rgba(255,255,255,0.1);
}

/* RESULT COUNT */

.result-count{
    margin-bottom:10px;
}

.loading{
    text-align:center;
}

</style>

</head>

<body>

<div class="header">

<img src="logo.png" class="logo">

<div class="title">
Report Supply System
</div>

</div>

<div class="container">

<div class="search-box">

<input type="text" id="search" placeholder="Masukkan KEY...">

<button onclick="searchData()">SEARCH</button>

</div>

<div id="loading" class="loading">
Loading data...
</div>

<div id="resultCount" class="result-count"></div>

<div id="output"></div>

</div>

<script>

const url="https://opensheet.elk.sh/1CaUTznJeeGUMuwhjLDKdVlivIB8cMt23B1DZ38PcY9w/Report%20Supply";

let data=[];

fetch(url)
.then(res=>res.json())
.then(json=>{
    data=json;
    document.getElementById("loading").style.display="none";
});

document.getElementById("search")
.addEventListener("keypress",function(e){

if(e.key==="Enter") searchData();

});

function searchData(){

const keyword=document
.getElementById("search")
.value
.toLowerCase()
.trim();

const results=data.filter(row=>
row["KEY"] &&
row["KEY"].toLowerCase().includes(keyword)
);

const output=document.getElementById("output");

const resultCount=document.getElementById("resultCount");

if(results.length===0){

resultCount.innerHTML="Tidak ditemukan";

output.innerHTML="";

return;

}

resultCount.innerHTML=
"Ditemukan "+results.length+" data";

let table="<div class='table-container'><table>";

table+="<tr>";

const headers=Object.keys(results[0]);

for(let i=2;i<=8;i++){

table+="<th>"+headers[i]+"</th>";

}

table+="</tr>";

results.forEach(row=>{

table+="<tr>";

for(let i=2;i<=8;i++){

table+="<td>"+row[headers[i]]+"</td>";

}

table+="</tr>";

});

table+="</table></div>";

output.innerHTML=table;

}

</script>

</body>
</html>
